<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Gallery</title>

<style>
body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    text-align:center;
    padding:35px;
    background:white;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    position:sticky;
    top:0;
    z-index:100;
}

h1{
    margin:0;
    font-size:2.5em;
}

p{
    color:#666;
}

.gallery{
    max-width:900px;
    margin:auto;
    padding:30px;
    display:flex;
    flex-direction:column;
    gap:25px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    transition: .25s;
}

.card:hover{
    transform:translateY(-4px)
}

.caption{
    padding:15px;
    font-size:18px;
    text-align:center;
}
</style>
</head>

<body>

<header>
    <h1>Dog Gallery</h1>
    <p>Cute dogs are from around the world.</p>
</header>

<div class="gallery" id="gallery"></div>

];

const gallery=document.getElementById("gallery");

function addImages(list){
    list.forEach((url, i) => {
        const card=document.createElement("div");
        card.className="card";

        card.innerHTML = `
            <img loading="lazy" src="${url}" alt="Dog ${i + 1}">
            <div class="caption">Good Dog #${i + 1}</div>
        `;

        gallery.appendChild(card);
    });
}

addImages(images);
addImages(images);

window.addEventListenner("scroll",()=>{
    if (window.innerHeight+window.scrollY>=document.body.offsetHeight-800) {
        addImages(images);
    }
});

</script>

</body>
</html>
